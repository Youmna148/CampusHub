<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — CampusHub</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-container {
      max-width: 480px;
      margin: 60px auto;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px;
      box-shadow: var(--shadow-lg);
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .auth-header h1 {
      margin-bottom: 8px;
    }
    
    .auth-header p {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }
    
    .password-field-wrapper {
      position: relative;
    }
    
    .password-toggle-btn {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }
    
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <!-- Navigation bar container -->
  <nav class="navbar" id="navbar-container"></nav>

  <main class="container">
    <div class="auth-container">
      <div class="auth-header">
        <h1>Create Account</h1>
        <p>Get started today to discover lectures, workshops, and gatherings.</p>
      </div>

      <form id="signup-form">
        <div class="form-group">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Ahmed Ali" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="ahmed@university.edu" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="password-field-wrapper">
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="new-password" minlength="8">
            <button type="button" class="password-toggle-btn" id="password-toggle">Show</button>
          </div>
        </div>

        <div class="form-group">
          <label for="password-confirm" class="form-label">Confirm Password</label>
          <input type="password" id="password-confirm" class="form-control" placeholder="••••••••" required autocomplete="new-password" minlength="8">
        </div>

        <div id="error-message" class="form-error" style="display: none; margin-bottom: 20px;"></div>

        <button type="submit" class="btn btn-accent" style="width: 100%;" id="submit-btn">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>
  </main>

  <!-- Footer bar container -->
  <footer class="footer" id="footer-container"></footer>

  <!-- API script integrations -->
  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const signupForm = document.getElementById('signup-form');
      const nameInput = document.getElementById('name');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const passwordConfirmInput = document.getElementById('password-confirm');
      const passwordToggle = document.getElementById('password-toggle');
      const errorMessage = document.getElementById('error-message');
      const submitBtn = document.getElementById('submit-btn');

      // Password visibility toggle
      passwordToggle.onclick = () => {
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          passwordConfirmInput.type = 'text';
          passwordToggle.textContent = 'Hide';
        } else {
          passwordInput.type = 'password';
          passwordConfirmInput.type = 'password';
          passwordToggle.textContent = 'Show';
        }
      };

      // Form submission
      signupForm.onsubmit = async (e) => {
        e.preventDefault();
        errorMessage.style.display = 'none';

        // Front-end validations
        if (passwordInput.value !== passwordConfirmInput.value) {
          errorMessage.textContent = 'Passwords do not match';
          errorMessage.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account...';

        const payload = {
          name: nameInput.value.trim(),
          email: emailInput.value.trim(),
          password: passwordInput.value,
          passwordConfirm: passwordConfirmInput.value
        };

        try {
          const res = await request('/users/signup', {
            method: 'POST',
            body: payload
          });

          if (res.status === 'success' && res.token) {
            setToken(res.token);
            showToast('Account created successfully!');
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 1000);
          }
        } catch (error) {
          console.error('Signup error:', error);
          errorMessage.textContent = error.message;
          errorMessage.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }
      };
    });
  </script>
</body>
</html>
