<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Event — CampusHub</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-container {
      max-width: 680px;
      margin: 40px auto;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px;
      box-shadow: var(--shadow-sm);
    }
    
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    
    @media (max-width: 768px) {
      .form-grid-2 {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation bar container -->
  <nav class="navbar" id="navbar-container"></nav>

  <main class="container">
    <!-- Loader -->
    <div id="form-loader" class="loader-spinner" style="margin: 80px auto;"></div>

    <div class="form-container" id="form-view" style="display: none;">
      <h1 style="margin-bottom: 8px;">Edit Event</h1>
      <p style="color: var(--text-secondary); margin-bottom: 32px;">Update details for your organized university event.</p>

      <form id="edit-event-form">
        <!-- Event Name -->
        <div class="form-group">
          <label for="event-name" class="form-label">Event Name</label>
          <input type="text" id="event-name" class="form-control" placeholder="Intro to Web Development" required maxlength="100">
        </div>

        <!-- Description -->
        <div class="form-group">
          <label for="event-desc" class="form-label">Description</label>
          <textarea id="event-desc" class="form-control" placeholder="What is this event about? Detailed description..." required></textarea>
        </div>

        <!-- Grid 2x2 fields -->
        <div class="form-grid-2">
          <!-- Price -->
          <div class="form-group">
            <label for="event-price" class="form-label">Price ($)</label>
            <input type="number" id="event-price" class="form-control" placeholder="0 for Free" required min="0" step="0.01">
          </div>

          <!-- Duration -->
          <div class="form-group">
            <label for="event-duration" class="form-label">Duration (hours)</label>
            <input type="number" id="event-duration" class="form-control" placeholder="e.g. 2" required min="0.5" step="0.5">
          </div>

          <!-- Category -->
          <div class="form-group">
            <label for="event-category" class="form-label">Category</label>
            <select id="event-category" class="form-control" required>
              <option value="" disabled>Select category</option>
              <option value="technology">Technology</option>
              <option value="career">Career</option>
              <option value="sports">Sports</option>
              <option value="workshop">Workshop</option>
              <option value="competition">Competition</option>
              <option value="other">Other</option>
            </select>
          </div>

          <!-- Capacity -->
          <div class="form-group">
            <label for="event-capacity" class="form-label">Capacity Limit (spots)</label>
            <input type="number" id="event-capacity" class="form-control" placeholder="e.g. 50" required min="1">
          </div>
        </div>

        <div class="form-grid-2">
          <!-- Location -->
          <div class="form-group">
            <label for="event-location" class="form-label">Location / Hall Room</label>
            <input type="text" id="event-location" class="form-control" placeholder="Hall Room 4B" required>
          </div>

          <!-- Start Date & Time -->
          <div class="form-group">
            <label for="event-start-date" class="form-label">Start Date & Time</label>
            <input type="datetime-local" id="event-start-date" class="form-control" required>
          </div>
        </div>

        <div id="error-message" class="form-error" style="display: none; margin-bottom: 24px;"></div>

        <div style="display: flex; gap: 16px; margin-top: 16px;">
          <a href="my-events.html" class="btn btn-outline" style="flex: 1;">Cancel</a>
          <button type="submit" class="btn btn-primary" style="flex: 2;" id="submit-btn">Save Changes</button>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer bar container -->
  <footer class="footer" id="footer-container"></footer>

  <!-- API script integrations -->
  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Direct protection: force load user and redirect if not organizer/admin
      const user = await loadUser();
      if (!user || (user.role !== 'organizer' && user.role !== 'admin')) {
        window.location.href = `login.html?redirect=${encodeURIComponent(window.location.pathname)}`;
        return;
      }

      const formLoader = document.getElementById('form-loader');
      const formView = document.getElementById('form-view');
      const form = document.getElementById('edit-event-form');
      const nameInput = document.getElementById('event-name');
      const descInput = document.getElementById('event-desc');
      const priceInput = document.getElementById('event-price');
      const durationInput = document.getElementById('event-duration');
      const categorySelect = document.getElementById('event-category');
      const capacityInput = document.getElementById('event-capacity');
      const locationInput = document.getElementById('event-location');
      const startDateInput = document.getElementById('event-start-date');
      const errorMsg = document.getElementById('error-message');
      const submitBtn = document.getElementById('submit-btn');

      // Retrieve event ID from query parameters
      const urlParams = new URLSearchParams(window.location.search);
      const eventId = urlParams.get('id');

      if (!eventId) {
        window.location.href = 'my-events.html';
        return;
      }

      // Load current event details
      let eventDetails = null;
      async function loadEvent() {
        try {
          const res = await request(`/events/${eventId}`);
          if (res.status === 'success') {
            eventDetails = res.data.event;
            
            // Check ownership safety
            if (user.role !== 'admin' && eventDetails.organizer._id !== user._id) {
              showToast('You do not have permission to edit this event', 'error');
              setTimeout(() => { window.location.href = 'my-events.html'; }, 1000);
              return;
            }

            prefillInputs();
          }
        } catch (error) {
          console.error('Failed to load event for edit:', error);
          showToast(error.message, 'error');
          setTimeout(() => { window.location.href = 'my-events.html'; }, 1000);
        }
      }

      function prefillInputs() {
        formLoader.style.display = 'none';
        formView.style.display = 'block';

        nameInput.value = eventDetails.name;
        descInput.value = eventDetails.description;
        priceInput.value = eventDetails.price;
        durationInput.value = eventDetails.duration;
        categorySelect.value = eventDetails.category;
        capacityInput.value = eventDetails.capacity;
        locationInput.value = eventDetails.location;
        
        // Format ISO date string into datetime-local format (YYYY-MM-DDTHH:MM)
        const dateObj = new Date(eventDetails.startDate);
        dateObj.setMinutes(dateObj.getMinutes() - dateObj.getTimezoneOffset());
        startDateInput.value = dateObj.toISOString().slice(0, 16);
      }

      form.onsubmit = async (e) => {
        e.preventDefault();
        errorMsg.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving...';

        const payload = {
          name: nameInput.value.trim(),
          description: descInput.value.trim(),
          price: parseFloat(priceInput.value),
          duration: parseFloat(durationInput.value),
          category: categorySelect.value,
          capacity: parseInt(capacityInput.value),
          location: locationInput.value.trim(),
          startDate: new Date(startDateInput.value).toISOString()
        };

        try {
          const res = await request(`/events/${eventId}`, {
            method: 'PATCH',
            body: payload
          });

          if (res.status === 'success') {
            showToast('Event updated successfully!', 'success');
            setTimeout(() => {
              window.location.href = 'my-events.html';
            }, 1000);
          }
        } catch (error) {
          console.error('Edit event submit error:', error);
          errorMsg.textContent = error.message;
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Save Changes';
        }
      };

      // Start loading
      loadEvent();
    });
  </script>
</body>
</html>
